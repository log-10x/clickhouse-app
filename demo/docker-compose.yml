services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: tenx-demo-clickhouse
    ports:
      - "18123:8123"
      - "19000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./sample:/sample:ro
      - ch-data:/var/lib/clickhouse

volumes:
  ch-data:
